<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Tests - AI Music Workstation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        h1 { color: #00d4ff; }
        h2 { color: #ff6b6b; margin-top: 30px; }
        .test-result {
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 4px;
            font-family: monospace;
        }
        .pass { background: #1b4332; border-left: 4px solid #40916c; }
        .fail { background: #5c1a1a; border-left: 4px solid #e74c3c; }
        .info { background: #1a3a5c; border-left: 4px solid #3498db; }
        #results { margin-top: 20px; }
        button {
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px 5px;
        }
        button:hover { background: #00b8d4; }
    </style>
</head>
<body>
    <h1>🧪 Store Tests - AI Music Workstation</h1>
    <p>Testing the centralized state management system.</p>
    
    <div>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div id="results"></div>

    <script type="module">
        import { store } from './state.js';

        let testCount = 0;
        let passCount = 0;
        let failCount = 0;

        window.logResult = function(testName, passed, details = '') {
            testCount++;
            if (passed) {
                passCount++;
            } else {
                failCount++;
            }
            
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${passed ? 'pass' : 'fail'}`;
            resultDiv.innerHTML = `
                <strong>${passed ? '✅ PASS' : '❌ FAIL'} [${testCount}]</strong> ${testName}
                ${details ? `<br><span style="color: #aaa; font-size: 0.9em;">${details}</span>` : ''}
            `;
            document.getElementById('results').appendChild(resultDiv);
        };

        window.logInfo = function(message) {
            const resultDiv = document.createElement('div');
            resultDiv.className = 'test-result info';
            resultDiv.innerHTML = `ℹ️ ${message}`;
            document.getElementById('results').appendChild(resultDiv);
        };

        window.clearResults = function() {
            document.getElementById('results').innerHTML = '';
            testCount = 0;
            passCount = 0;
            failCount = 0;
        };

        // =====================
        // TESTS
        // =====================

        window.testInitialState = function() {
            logInfo('Testing initial state...');
            
            logResult('Initial projects is empty array', 
                JSON.stringify(store.get('projects')) === '[]',
                `Got: ${JSON.stringify(store.get('projects'))}`);
            
            logResult('Initial currentProject is null', 
                store.get('currentProject') === null,
                `Got: ${store.get('currentProject')}`);
            
            logResult('Initial currentTrack is null', 
                store.get('currentTrack') === null,
                `Got: ${store.get('currentTrack')}`);
            
            logResult('Initial waveform is null', 
                store.get('waveform') === null,
                `Got: ${store.get('waveform')}`);
            
            logResult('Initial playback.isPlaying is false', 
                store.get('playback').isPlaying === false,
                `Got: ${store.get('playback').isPlaying}`);
            
            logResult('Initial playback.position is 0', 
                store.get('playback').position === 0,
                `Got: ${store.get('playback').position}`);
            
            logResult('Initial ui.activeTab is "analyze"', 
                store.get('ui').activeTab === 'analyze',
                `Got: ${store.get('ui').activeTab}`);
            
            logResult('Initial ui.sidebarOpen is true', 
                store.get('ui').sidebarOpen === true,
                `Got: ${store.get('ui').sidebarOpen}`);
        };

        window.testSetAndGet = function() {
            logInfo('Testing set() and get()...');
            
            // Save original
            const originalProjects = store.get('projects');
            
            // Set new value
            const newProject = { id: '1', name: 'Test Project' };
            store.set('currentProject', newProject);
            
            logResult('get() returns updated value', 
                store.get('currentProject').name === 'Test Project',
                `Got: ${store.get('currentProject').name}`);
            
            // Restore original
            store.set('currentProject', originalProjects);
        };

        window.testSubscribeNotify = function() {
            logInfo('Testing subscribe/notify cycle...');
            
            let updateCount = 0;
            let lastValue = null;
            
            const unsubscribe = store.subscribe('playback', (newValue) => {
                updateCount++;
                lastValue = newValue;
            });
            
            // Trigger update
            store.set('playback', { isPlaying: true, position: 100, duration: 300 });
            
            logResult('Subscriber received update', 
                updateCount === 1,
                `Update count: ${updateCount}`);
            
            logResult('Subscriber received correct value', 
                lastValue.isPlaying === true && lastValue.position === 100,
                `Got: isPlaying=${lastValue?.isPlaying}, position=${lastValue?.position}`);
            
            // Restore
            store.set('playback', { isPlaying: false, position: 0, duration: 0 });
            
            // Unsubscribe
            unsubscribe();
            
            store.set('playback', { isPlaying: true, position: 50, duration: 200 });
            
            logResult('Unsubscribed listener does not receive updates', 
                updateCount === 1,
                `Update count after unsubscribe: ${updateCount}`);
        };

        window.testMultipleSubscribers = function() {
            logInfo('Testing multiple subscribers...');
            
            let subscriber1Updates = 0;
            let subscriber2Updates = 0;
            
            const unsub1 = store.subscribe('ui', () => { subscriber1Updates++; });
            const unsub2 = store.subscribe('ui', () => { subscriber2Updates++; });
            
            store.set('ui', { activeTab: 'mix', sidebarOpen: false });
            store.set('ui', { activeTab: 'analyze', sidebarOpen: true });
            
            logResult('First subscriber received both updates', 
                subscriber1Updates === 2,
                `Subscriber 1 updates: ${subscriber1Updates}`);
            
            logResult('Second subscriber received both updates', 
                subscriber2Updates === 2,
                `Subscriber 2 updates: ${subscriber2Updates}`);
            
            unsub1();
            unsub2();
        };

        window.testImmutableUpdates = function() {
            logInfo('Testing immutable updates...');
            
            const originalPlayback = store.get('playback');
            const originalPosition = originalPlayback.position;
            
            // Create a new object
            const newPlayback = { isPlaying: true, position: 50, duration: 180 };
            store.set('playback', newPlayback);
            
            const updatedPlayback = store.get('playback');
            
            logResult('State was updated (position changed)', 
                updatedPlayback.position === 50,
                `Position: ${updatedPlayback.position}`);
            
            // Verify deep clone (modifying newPlayback shouldn't affect store)
            newPlayback.position = 999;
            const stillUpdated = store.get('playback').position;
            
            logResult('Original object mutation does not affect store', 
                stillUpdated === 50,
                `Store position: ${stillUpdated}, mutated object: 999`);
            
            // Restore
            store.set('playback', { isPlaying: false, position: 0, duration: 0 });
        };

        window.testUnknownKeyWarning = function() {
            logInfo('Testing unknown key warning...');
            
            // Capture console.warn
            let warnCalled = false;
            const originalWarn = console.warn;
            console.warn = () => { warnCalled = true; };
            
            store.set('unknownKey', 'test');
            
            console.warn = originalWarn;
            
            logResult('Warning logged for unknown key', 
                warnCalled,
                `console.warn was called: ${warnCalled}`);
        };

        window.testBatchUpdate = function() {
            logInfo('Testing batchUpdate()...');
            
            let uiUpdates = 0;
            const unsub = store.subscribe('ui', () => { uiUpdates++; });
            
            store.batchUpdate({
                ui: { activeTab: 'mix', sidebarOpen: false }
            });
            
            logResult('batchUpdate notifies subscribers', 
                uiUpdates === 1,
                `UI updates: ${uiUpdates}`);
            
            logResult('batchUpdate sets correct values', 
                store.get('ui').activeTab === 'mix' && store.get('ui').sidebarOpen === false,
                `Got: activeTab=${store.get('ui').activeTab}, sidebarOpen=${store.get('ui').sidebarOpen}`);
            
            unsub();
            
            // Restore
            store.set('ui', { activeTab: 'analyze', sidebarOpen: true });
        };

        window.runAllTests = function() {
            clearResults();
            logInfo('🚀 Starting all tests...\n');
            
            testInitialState();
            testSetAndGet();
            testSubscribeNotify();
            testMultipleSubscribers();
            testImmutableUpdates();
            testUnknownKeyWarning();
            testBatchUpdate();
            
            logInfo('');
            logInfo(`═══════════════════════════════════════`);
            logInfo(`Results: ${passCount} passed, ${failCount} failed, ${testCount} total`);
            logInfo(`═══════════════════════════════════════`);
        };

        // Auto-run on load
        setTimeout(runAllTests, 100);
    </script>
</body>
</html>
